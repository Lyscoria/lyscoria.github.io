    <path data-from="x2-1" data-to="x2-0" d="M 165 360 H 137"/>
    <path data-from="x2-2" data-to="x2-1" d="M 215 360 H 187"/>
    <path data-from="x2-2" data-to="x2-3" d="M 233 350 H 261"/>
    <path data-from="x2-3" data-to="x2-2" d="M 265 360 H 237"/>
    <path data-from="x2-4" data-to="x2-3" d="M 315 360 H 287"/>
    <path data-from="x2-5" data-to="x2-4" d="M 365 360 H 337"/>
    <path data-from="x2-6" data-to="x2-5" d="M 415 360 H 387"/>
    <path data-from="x2-7" data-to="x2-6" d="M 465 360 H 437"/>
    <path data-from="x2-8" data-to="x2-7" d="M 515 360 H 487"/>
    <path data-from="x2-8" data-to="x2-9" d="M 533 350 H 561"/>
    <path data-from="x2-9" data-to="x2-8" d="M 565 360 H 537"/>
    <path data-from="x2-10" data-to="x2-9" d="M 615 360 H 587"/>
    <path data-from="x2-11" data-to="x2-10" d="M 665 360 H 637"/>
  </g>
  <g class="clause">
    <path data-from="x1-2" data-to="c1" d="M 224 147 C 327 68 595 62 807 75"/>
    <path data-from="c1" data-to="x1-3" d="M 810 83 C 601 76 382 87 282 146"/>
    <path data-from="x1-9" data-to="c3" d="M 580 165 C 642 236 748 347 811 419"/>
    <path data-from="c3" data-to="x1-8" d="M 812 426 C 737 354 621 243 533 167"/>
    <path data-from="x2-6" data-to="c2" d="M 432 347 C 533 311 692 265 809 255"/>
    <path data-from="c2" data-to="x2-5" d="M 810 240 C 652 253 473 303 384 345"/>
  </g>
  <g class="route">
    <path data-from="s" data-to="x1-11" d="M 414 64 L 661 151"/>
    <path data-from="x1-0" data-to="b" d="M 135 162 L 381 250"/>
    <path data-from="b" data-to="x2-0" d="M 383 262 L 138 350"/>
    <path data-from="x2-11" data-to="t" d="M 663 360 L 417 448"/>
    <path data-from="x1-1" data-to="x1-0" d="M 165 162 H 137"/>
    <path data-from="x1-2" data-to="x1-1" d="M 215 162 H 187"/>
    <path data-from="x1-3" data-to="x1-2" d="M 265 162 H 237"/>
    <path data-from="x1-4" data-to="x1-3" d="M 315 162 H 287"/>
    <path data-from="x1-5" data-to="x1-4" d="M 365 162 H 337"/>
    <path data-from="x1-7" data-to="x1-6" d="M 465 162 H 437"/>
    <path data-from="x1-8" data-to="x1-7" d="M 515 162 H 487"/>
    <path data-from="x1-9" data-to="x1-8" d="M 565 162 H 537"/>
    <path data-from="x1-10" data-to="x1-9" d="M 615 162 H 587"/>
    <path data-from="x1-11" data-to="x1-10" d="M 665 162 H 637"/>
    <path data-from="x2-0" data-to="x2-1" d="M 133 350 H 161"/>
    <path data-from="x2-1" data-to="x2-2" d="M 183 350 H 211"/>
    <path data-from="x2-3" data-to="x2-4" d="M 283 350 H 311"/>
    <path data-from="x2-4" data-to="x2-5" d="M 333 350 H 361"/>
    <path data-from="x2-5" data-to="x2-6" d="M 383 350 H 411"/>
    <path data-from="x2-6" data-to="x2-7" d="M 433 350 H 461"/>
    <path data-from="x2-7" data-to="x2-8" d="M 483 350 H 511"/>
    <path data-from="x2-9" data-to="x2-10" d="M 583 350 H 611"/>
    <path data-from="x2-10" data-to="x2-11" d="M 633 350 H 661"/>
  </g>
  <g class="detour">
    <path data-from="x1-6" data-to="c2" d="M 429 166 C 533 198 674 224 808 246"/>
    <path data-from="c2" data-to="x1-5" d="M 809 253 C 665 236 497 207 385 166"/>
    <path data-from="x2-2" data-to="c1" d="M 232 347 C 341 286 694 326 813 92"/>
    <path data-from="c1" data-to="x2-3" d="M 819 94 C 748 304 432 298 285 347"/>
    <path data-from="x2-8" data-to="c3" d="M 533 361 C 607 387 723 412 807 425"/>
    <path data-from="c3" data-to="x2-9" d="M 809 434 C 727 429 625 391 585 363"/>
  </g>

  <use href="#chain-nodes" y="157"/>
  <use href="#chain-nodes" y="355"/>
  <g class="endpoint">
    <circle cx="399" cy="58" r="16"/>
    <circle cx="399" cy="256" r="16"/>
    <circle cx="399" cy="454" r="16"/>
  </g>
  <g class="clause-node">
    <circle cx="824" cy="80" r="14"/>
    <circle cx="824" cy="249" r="14"/>
    <circle cx="824" cy="430" r="14"/>
  </g>
  <g class="node-label">
    <text x="399" y="65">s</text><text x="399" y="263">b</text><text x="399" y="461">t</text>
  </g>
  <g class="row-label">
    <text x="78" y="166">x₁</text><text x="78" y="364">x₂</text>
    <text class="clause-label" x="864" y="89">C₁</text>
    <text class="clause-label" x="864" y="258">C₂</text>
    <text class="clause-label" x="864" y="439">C₃</text>
  </g>
</svg>
