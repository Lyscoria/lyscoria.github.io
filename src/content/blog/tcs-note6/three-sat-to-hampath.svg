<svg xmlns="http://www.w3.org/2000/svg" width="920" height="510" viewBox="0 0 920 510" role="img" aria-labelledby="title description">
  <title id="title">从 3SAT 到有向哈密顿路径的完整构造</title>
  <desc id="description">两条变量链上下排列，起点 s、中转点 b 和终点 t 居中，三个子句顶点列在右侧。高亮的路径从 s 出发，第一行从右往左并经过 C₂，第二行从左往右并依次经过 C₁、C₃，最后到达 t。</desc>
  <defs>
    <marker id="muted-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#869bb2"/>
    </marker>
    <marker id="route-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2b5d8d"/>
    </marker>
    <marker id="detour-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#ad621e"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; text-anchor: middle; font-weight: 600; fill: #2b5d8d; }
      .edge, .clause, .route, .detour { fill: none; stroke-linecap: round; }
      .edge, .clause { stroke: #869bb2; stroke-width: 1.4; marker-end: url(#muted-arrow); }
      .clause { stroke: #a2b2c3; }
      .route { stroke: #2b5d8d; stroke-width: 2.8; marker-end: url(#route-arrow); }
      .detour { stroke: #ad621e; stroke-width: 3; marker-end: url(#detour-arrow); }
      .chain-node { fill: #fff; stroke: #628bb9; stroke-width: 1.7; }
      .endpoint { fill: #eaf2fc; stroke: #628bb9; stroke-width: 2; }
      .clause-node { fill: #fcf0d9; stroke: #c28e48; stroke-width: 2; }
      .clause-label { fill: #8b531b; }
      .row-label { font-size: 30px; }
      .node-label { font-size: 22px; }
    </style>
    <g id="chain-nodes" class="chain-node">
      <circle cx="124" cy="0" r="10"/>
      <circle cx="174" cy="0" r="10"/>
      <circle cx="224" cy="0" r="10"/>
      <circle cx="274" cy="0" r="10"/>
      <circle cx="324" cy="0" r="10"/>
      <circle cx="374" cy="0" r="10"/>
      <circle cx="424" cy="0" r="10"/>
      <circle cx="474" cy="0" r="10"/>
      <circle cx="524" cy="0" r="10"/>
      <circle cx="574" cy="0" r="10"/>
      <circle cx="624" cy="0" r="10"/>
      <circle cx="674" cy="0" r="10"/>
    </g>
    <g id="pairs" fill="#eff5fc" stroke="#a4b8cd" stroke-width="1.4" stroke-dasharray="3 5">
      <ellipse cx="249" cy="0" rx="42" ry="20"/>
      <ellipse cx="399" cy="0" rx="42" ry="20"/>
      <ellipse cx="549" cy="0" rx="42" ry="20"/>
    </g>
  </defs>

  <rect width="920" height="510" rx="24" fill="#fff"/>
  <rect x="18" y="18" width="884" height="474" rx="20" fill="#f8fafc" stroke="#d9e1ea" stroke-width="2"/>
  <use href="#pairs" y="157"/>
  <use href="#pairs" y="355"/>

  <g class="edge">
    <path data-from="s" data-to="x1-0" d="M 384 64 L 136 151"/>
    <path data-from="x1-11" data-to="b" d="M 663 162 L 416 250"/>
    <path data-from="b" data-to="x2-11" d="M 415 262 L 660 350"/>
    <path data-from="x2-0" data-to="t" d="M 135 360 L 382 448"/>
